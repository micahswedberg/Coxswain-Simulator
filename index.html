<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coxswain Simulator</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div id="header">
        <span>Maneuvering Sim</span>
        <span id="speed-display">0.0 m/s</span>
    </div>
    
    <div id="water-container">
        <div id="map-background"></div>
        <canvas id="lakeCanvas"></canvas>
        
        <!-- Floating Build Menu -->
        <div id="build-menu-container">
            <div id="build-toggle" class="build-btn" onclick="toggleBuildMenu()">🛠️</div>
            <div id="build-options" class="build-options">
                <div class="build-btn tool-drag" data-type="buoy">🟠</div>
                <div class="build-btn tool-drag" data-type="dock">🟫</div>
                <div class="build-btn tool-drag" data-type="boat">🛶</div>
                <div class="build-btn" id="btn-eraser" onclick="toggleEraser()">🚫</div>
            </div>
        </div>

        <!-- Settings Menu FAB -->
        <div id="settings-menu-container">
            <div id="settings-toggle" class="build-btn" onclick="toggleSettingsMenu()">⚙️</div>
            <div id="settings-options" class="popup-panel">
                <button class="menu-item-btn" onclick="resetSim(); toggleSettingsMenu();">🔄 Reset Sim</button>
                <button class="menu-item-btn danger" onclick="clearMap(); toggleSettingsMenu();">🗑️ Clear Map</button>
                <button class="menu-item-btn" onclick="saveScenario(); toggleSettingsMenu();">💾 Save Scenario</button>
                <button class="menu-item-btn" onclick="document.getElementById('file-input').click(); toggleSettingsMenu();">📂 Load Scenario</button>
                <!-- Hidden file input for loading data -->
                <input type="file" id="file-input" accept=".json" style="display: none;" onchange="loadScenario(event)">
            </div>
        </div>

        <!-- Drag & Drop Visuals -->
        <div id="drag-ghost"></div>
        <div id="eraser-cursor"></div>

        <!-- Wind Editor Popup -->
        <div id="wind-dialog" class="popup-panel" style="top: 80px; right: 15px; width: 260px;">
            <h3>Wind Settings</h3>
            <div style="margin-bottom: 12px;">
                <div class="popup-row">
                    <span>Speed:</span>
                    <strong id="wind-speed-val">12 mph</strong>
                </div>
                <div style="display: flex; gap: 6px; align-items: center; margin-top: 4px;">
                    <button class="btn" style="padding: 4px 10px;" onclick="adjustWindSpeed(-1)">-</button>
                    <input type="range" id="wind-speed-slider" min="0" max="20" value="12" style="flex:1;" oninput="onWindSliderChange()">
                    <button class="btn" style="padding: 4px 10px;" onclick="adjustWindSpeed(1)">+</button>
                </div>
            </div>

            <div style="margin-bottom: 12px;">
                <div class="popup-row">
                    <span>Direction:</span>
                    <strong id="wind-dir-val">180° (S)</strong>
                </div>
                <div style="display: flex; gap: 6px; align-items: center; margin-top: 4px;">
                    <button class="btn" style="padding: 4px 10px;" onclick="adjustWindDir(-5)">-</button>
                    <input type="range" id="wind-dir-slider" min="0" max="360" step="5" value="180" style="flex:1;" oninput="onWindSliderChange()">
                    <button class="btn" style="padding: 4px 10px;" onclick="adjustWindDir(5)">+</button>
                </div>
            </div>

            <button class="btn btn-primary" style="padding:8px; margin-top: 4px;" onclick="document.getElementById('wind-dialog').style.display='none'; draw();">Done</button>
        </div>

        <!-- Entity Editor Tooltip -->
        <div id="entity-tooltip" class="popup-panel">
            <h3 id="tooltip-title">Edit Object</h3>
            <div id="tooltip-content"></div>
            <div class="popup-actions" id="tooltip-actions"></div>
        </div>
    </div>
    
    <div id="controls-container">
        <!-- Location Select Dropdown -->
        <div class="toolbar" style="padding-bottom: 5px;">
            <select id="location-select" class="btn" style="background: var(--bg-color); border: 1px solid var(--accent);">
                <option value="blackwell">Lake Carl Blackwell, OK</option>
                <option value="okc">Oklahoma River, OKC</option>
                <option value="charles">Charles River, Boston</option>
                <option value="empty">Blank Water (No Map)</option>
            </select>
        </div>

        <div class="rudder-control">
            <label>Rudder Position: <span id="rudder-val">Center</span></label>
            <input type="range" id="rudder" min="-45" max="45" value="0">
        </div>

        <div class="seat-grid" id="seats-container"></div>
        <button class="btn btn-primary" id="btn-next-stroke" onclick="simulateStroke()">Simulate Next Stroke (+4s)</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
